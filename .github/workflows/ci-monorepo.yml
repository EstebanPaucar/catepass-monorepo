name: CatePass Monorepo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-shared-contracts:
    name: Validate Shared Contracts (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck:shared

  validate-backend-monolith:
    name: Validate Backend Modular Monolith (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-monolith
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Backend Dependencies
        run: pip install -r requirements.txt
      - name: Verify Python Syntax & Module Imports
        run: python -m compileall src